dimensions:
  - Availability
  - Accessibility
  - Accommodation
  - Affordability
  - Acceptability

embedding_model: sentence-transformers/all-MiniLM-L12-v2

topic_model:
  umap:
    n_neighbors: 30
    n_components: 5
    min_dist: 0.05
    metric: cosine
    random_state: 42
  hdbscan:
    min_cluster_size: 120
    min_samples: 15
    metric: euclidean
    cluster_selection_method: leaf
    prediction_data: true

dimension_assignment:
  temperature: 0.11
  probability_margin: 0.17
  maximum_labels: 3

review_score:
  "1": -1
  "2": 0
  "3": 0
  "4": 0
  "5": 1

partial_pooling:
  draws: 2000
  tune: 2000
  chains: 4
  target_accept: 0.95
  random_seed: 123
  mu_prior_sd: 0.5
  tau_prior_sd: 0.5

